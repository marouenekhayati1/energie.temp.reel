<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>⚡ WattNow Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>⚡ WattNow Dashboard</h1>

<div class="grid">

  <div class="card">
    <div>Consommation</div>
    <div id="conso" class="value conso">0</div>
  </div>

  <div class="card">
    <div>Production</div>
    <div id="prod" class="value prod">0</div>
  </div>

  <div class="card">
    <div>Delta</div>
    <div id="delta" class="value delta">0</div>
  </div>

  <div class="card">
    <div>Régime STEG</div>
    <div id="stegStatus" class="value">---</div>
  </div>

</div>

<div class="card message-card">
  <div id="stegMessage">Chargement...</div>
</div>

<h3>Sections</h3>
<div class="devices" id="devices"></div>

<!-- ===== Sélecteur de jour et période ===== -->
<!-- ===== Sélecteur de jour et période ===== -->
<div class="controls">
  <label>📅 Jour :</label>
  <select id="daySelect" onchange="loadChartData()">
    <option value="today">🔴 Temps réel (Live)</option>
  </select>

  <label>De :</label>
  <select id="startHour" onchange="loadChartData()"></select>

  <label>À :</label>
  <select id="endHour" onchange="loadChartData()"></select>
</div>

<!-- ===== Tendances ===== -->
<h3>📈 Tendance de la période</h3>
<div class="trends">
  <div class="trend">
    <div>Conso moyenne</div>
    <div id="tConsoMoy" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Conso max</div>
    <div id="tConsoMax" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Prod moyenne</div>
    <div id="tProdMoy" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Prod max</div>
    <div id="tProdMax" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Énergie conso (kWh)</div>
    <div id="tEnergie" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Énergie produite (kWh)</div>
    <div id="tEnergieProd" class="t-value">---</div>
  </div>
</div>
  

<div class="chart-container">
  <canvas id="chart"></canvas>
</div>

<script src="script.js"></script>

</body>
</html>
