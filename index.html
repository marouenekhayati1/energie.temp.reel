<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>⚡ WattNow Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header-nav">
  <h1>⚡ WattNow Dashboard</h1>
  <a href="stoppages.html" class="nav-btn">🛑 Suivi des Arrêts & Bilan Mensuel</a>
</div>

<!-- Cartes Temps Réel -->
<div class="grid">
  <div class="card">
    <div class="card-title">Consommation</div>
    <div id="conso" class="value conso">0 kW</div>
  </div>

  <div class="card">
    <div class="card-title">Production</div>
    <div id="prod" class="value prod">0 kW</div>
  </div>

  <div class="card">
    <div class="card-title">Delta</div>
    <div id="delta" class="value delta">0 kW</div>
  </div>

  <div class="card">
    <div class="card-title">Régime STEG</div>
    <div id="stegStatus" class="value" style="font-size:18px;">---</div>
  </div>
</div>

<div class="card message-card" style="margin-top:12px;">
  <div id="stegMessage">Chargement des données...</div>
</div>

<!-- Zone Sections (Groupes et Sites) -->
<h3 class="section-title">⚡ Sections</h3>
<div class="devices" id="devices"></div>

<!-- Sélecteur de jour et d'heures -->
<div class="controls">
  <label>📅 Jour :</label>
  <select id="daySelect" onchange="loadChartData()"></select>

  <label>De :</label>
  <select id="startHour" onchange="loadChartData()"></select>

  <label>À :</label>
  <select id="endHour" onchange="loadChartData()"></select>
</div>

<!-- Tendances de la Période -->
<h3 class="section-title">📈 Tendance de la Période</h3>
<div class="trends">
  <div class="trend">
    <div>Conso moyenne</div>
    <div id="tConsoMoy" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Conso max</div>
    <div id="tConsoMax" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Prod moyenne</div>
    <div id="tProdMoy" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Prod max</div>
    <div id="tProdMax" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Énergie conso</div>
    <div id="tEnergie" class="t-value">---</div>
  </div>
  <div class="trend">
    <div>Énergie produite</div>
    <div id="tEnergieProd" class="t-value">---</div>
  </div>
</div>

<!-- Graphique -->
<div class="chart-container">
  <canvas id="chart"></canvas>
</div>

<script src="script.js"></script>

</body>
</html>
